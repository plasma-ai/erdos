name = "Erdos809"
defaultTargets = ["Erdos809", "Challenge", "Solution"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Erdos809"
globs = ["Erdos809.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
